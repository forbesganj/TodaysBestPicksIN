name: DailyVaultIN Deals Bot

on:
  schedule:
    # Runs every 2 hours. GitHub's cron scheduler is best-effort and can
    # be delayed by several minutes during peak load - see README
    # "Limitations" for why this is not millisecond-precise.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Prevent overlapping runs from racing on the same state files
concurrency:
  group: deals-bot
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit updated data/ files back

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deals bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MIN_DISCOUNT_PERCENT: ${{ secrets.MIN_DISCOUNT_PERCENT }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN }}

          AMAZON_ENABLED: ${{ secrets.AMAZON_ENABLED }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_COUNTRY: ${{ secrets.AMAZON_COUNTRY }}
          AMAZON_SEARCH_KEYWORDS: ${{ secrets.AMAZON_SEARCH_KEYWORDS }}

          FLIPKART_ENABLED: ${{ secrets.FLIPKART_ENABLED }}
          FLIPKART_FEED_URLS: ${{ secrets.FLIPKART_FEED_URLS }}
          FLIPKART_AFFILIATE_ID: ${{ secrets.FLIPKART_AFFILIATE_ID }}
          FLIPKART_AFFILIATE_TOKEN: ${{ secrets.FLIPKART_AFFILIATE_TOKEN }}

          GENERIC_FEEDS_ENABLED: ${{ secrets.GENERIC_FEEDS_ENABLED }}
          GENERIC_FEEDS_CONFIG: ${{ secrets.GENERIC_FEEDS_CONFIG }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_deals.json data/price_history.json data/bot.log
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update dedup/price-history state [skip ci]"
            git push
          fi
